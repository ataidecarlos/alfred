# Clean, container-first Alfred configuration.
#
# Alfred delegates the agent loop to Pi (https://github.com/earendil-works/pi),
# which it runs as a subprocess. Pi reads its provider key from the environment
# variable named by [pi].api_key_env; Alfred expands ${...} references when the
# config is loaded (see src/config.rs::expand_env_vars). The key is passed to
# the subprocess by environment, never by --api-key.

[server]
port = 3000
host = "0.0.0.0"

# The Pi subprocess. `binary` must be on PATH (the Docker image provides it).
[pi]
binary = "pi"
api_key_env = "PI_API_KEY"
provider = "opencode-go"
model = "space-bunny-free"
thinking = "off"

# Empty table: prompt files use the default paths under ~/.alfred/config/prompts.
[prompt]

[scheduler]
enabled = false

[memory]
enabled = false
