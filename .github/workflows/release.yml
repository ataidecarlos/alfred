name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Pi is a runtime dependency of Alfred: the binary delegates the agent loop,
# LLM providers, tool calling, sessions, compaction, and streaming to
# `pi --mode rpc`. Every release ships a note saying so and is gated on an
# RPC-handshake smoke check against a pinned Pi. Bump PI_VERSION deliberately:
# the release fails when the newly pinned Pi no longer answers the handshake
# Alfred's client requires, instead of discovering that in production.
env:
  PI_VERSION: "0.99.1"

jobs:
  # Gate: prove the pinned Pi still speaks the RPC handshake Alfred depends on.
  # The `release` job needs this, so a failure blocks publication.
  rpc-smoke:
    name: Pi RPC handshake smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: Install pinned Pi
        run: |
          npm install -g "@earendil-works/pi-coding-agent@${PI_VERSION}"
          command -v pi
          pi --version

      # Alfred's transport is JSONL on stdin/stdout: one JSON command per line,
      # one JSON record per line back, responses correlated by `id`. This client
      # is an independent implementation of that contract, so a framing or
      # response-shape change in Pi fails the release.
      - name: Verify the pinned Pi RPC handshake
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          export PI_CODING_AGENT_DIR="${work}/pi-agent"
          export PI_CODING_AGENT_SESSION_DIR="${work}/pi-sessions"
          export PI_SKIP_VERSION_CHECK=1
          export PI_TELEMETRY=0
          export PI_OFFLINE=1
          cat > "${work}/handshake.mjs" <<'NODE'
          import { spawn } from "node:child_process";

          const ID = "alfred-release-smoke-1";
          const child = spawn("pi", ["--mode", "rpc", "--no-session"], {
            stdio: ["pipe", "pipe", "pipe"],
          });

          let buffer = "";
          let stderr = "";
          let settled = false;

          function fail(message) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            child.kill();
            console.error("RPC handshake FAILED: " + message);
            if (stderr.trim()) console.error("pi stderr:\n" + stderr);
            process.exit(1);
          }

          const timer = setTimeout(function () {
            fail("timed out waiting for a get_state response");
          }, 30000);

          child.stderr.on("data", function (chunk) {
            stderr += chunk.toString("utf8");
          });
          child.on("error", function (error) {
            fail("could not start pi: " + error.message);
          });
          child.on("exit", function (code) {
            fail("pi exited early with code " + code);
          });
          child.stdin.on("error", function (error) {
            fail("could not write to pi: " + error.message);
          });

          child.stdout.on("data", function (chunk) {
            buffer += chunk.toString("utf8");
            let newline;
            while ((newline = buffer.indexOf("\n")) !== -1) {
              const line = buffer.slice(0, newline).replace(/\r$/, "");
              buffer = buffer.slice(newline + 1);
              if (!line.trim()) continue;
              let record;
              try {
                record = JSON.parse(line);
              } catch (error) {
                continue; // unparseable records are skipped, never fatal
              }
              if (record.type !== "response" || record.id !== ID) continue;
              if (record.command !== "get_state" || record.success !== true) {
                fail("unexpected get_state response: " + JSON.stringify(record));
                return;
              }
              settled = true;
              clearTimeout(timer);
              child.kill();
              console.log("RPC handshake OK: " + JSON.stringify(record));
              process.exit(0);
            }
          });

          child.stdin.write(JSON.stringify({ id: ID, type: "get_state" }) + "\n");
          NODE
          node "${work}/handshake.mjs"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.platform != 'windows-x64'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PLATFORM=${{ matrix.platform }}
          BINARY_NAME=alfred
          
          # Create staging directory
          STAGING_DIR="alfred-v${VERSION}-${PLATFORM}"
          mkdir -p "${STAGING_DIR}/prompts"
          
          # Copy binary (rename to just 'alfred')
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${STAGING_DIR}/"
          
          # Copy config templates
          cp config/config.toml.example "${STAGING_DIR}/" 2>/dev/null || true
          cp prompts/system.md.example "${STAGING_DIR}/prompts/" 2>/dev/null || true
          cp prompts/user.md.example "${STAGING_DIR}/prompts/" 2>/dev/null || true
          
          # Copy README
          cp README.md "${STAGING_DIR}/"
          
          # Note that Pi is a runtime dependency, not bundled here.
          cat > "${STAGING_DIR}/PI-RUNTIME.txt" <<EOF
          Alfred is one half of the product; Pi is the other.
          Pi (https://github.com/earendil-works/pi) is a RUNTIME dependency and is
          not bundled in this archive. Alfred delegates the agent loop, LLM
          providers, tool calling, sessions, compaction, and streaming to
          'pi --mode rpc'.
          
          Install Pi either:
            - via npm (requires Node >= 22.19):
                npm install -g @earendil-works/pi-coding-agent
            - or let scripts/install.sh (or install.ps1) fetch the standalone
              Pi binary and install both parts for you.
          
          This release was smoke-checked against Pi ${PI_VERSION}.
          EOF
          
          # Create tarball
          tar -czf "${STAGING_DIR}.tar.gz" "${STAGING_DIR}"
          
          # Generate checksum
          sha256sum "${STAGING_DIR}.tar.gz" > "${STAGING_DIR}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $PLATFORM = '${{ matrix.platform }}'
          $STAGING_DIR = "alfred-v${VERSION}-${PLATFORM}"
          
          New-Item -ItemType Directory -Path $STAGING_DIR -Force
          New-Item -ItemType Directory -Path "${STAGING_DIR}/prompts" -Force
          
          # Copy binary (rename to just 'alfred.exe')
          Copy-Item "target/${{ matrix.target }}/release/alfred.exe" "${STAGING_DIR}/"
          
          # Copy config templates
          if (Test-Path "config/config.toml.example") {
              Copy-Item "config/config.toml.example" "${STAGING_DIR}/"
          }
          if (Test-Path "prompts/system.md.example") {
              Copy-Item "prompts/system.md.example" "${STAGING_DIR}/prompts/"
          }
          if (Test-Path "prompts/user.md.example") {
              Copy-Item "prompts/user.md.example" "${STAGING_DIR}/prompts/"
          }
          
          # Copy README
          Copy-Item "README.md" "${STAGING_DIR}/"
          
          # Note that Pi is a runtime dependency, not bundled here.
          @"
          Alfred is one half of the product; Pi is the other.
          Pi (https://github.com/earendil-works/pi) is a RUNTIME dependency and is
          not bundled in this archive. Alfred delegates the agent loop, LLM
          providers, tool calling, sessions, compaction, and streaming to
          'pi --mode rpc'.
          
          Install Pi either:
            - via npm (requires Node >= 22.19):
                npm install -g @earendil-works/pi-coding-agent
            - or let scripts/install.ps1 (or install.sh) fetch the standalone
              Pi binary and install both parts for you.
          
          This release was smoke-checked against Pi $env:PI_VERSION.
          "@ | Out-File -FilePath "${STAGING_DIR}/PI-RUNTIME.txt" -Encoding utf8
          
          # Create zip
          Compress-Archive -Path $STAGING_DIR -DestinationPath "${STAGING_DIR}.zip"
          
          # Generate checksum
          $hash = (Get-FileHash -Path "${STAGING_DIR}.zip" -Algorithm SHA256).Hash.ToLower()
          "${hash}  ${STAGING_DIR}.zip" | Out-File -FilePath "${STAGING_DIR}.zip.sha256" -Encoding utf8

      # The fake-pi test double is a `[[bin]]` target, so `cargo build` emits it
      # next to `alfred`. It must never ship: assert it is absent from the
      # archive, not merely absent from the staging directory.
      - name: Verify test double is excluded (Unix)
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE="alfred-v${VERSION}-${{ matrix.platform }}.tar.gz"
          if tar -tzf "${ARCHIVE}" | grep -qE '(^|/)fake-pi(\.exe)?$'; then
            echo "::error::fake-pi test double must not be shipped in ${ARCHIVE}"
            tar -tzf "${ARCHIVE}"
            exit 1
          fi
          echo "${ARCHIVE} ships no fake-pi"

      - name: Verify test double is excluded (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $ARCHIVE = "alfred-v${VERSION}-${{ matrix.platform }}.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ARCHIVE))
          try {
              $bad = @($zip.Entries | Where-Object { $_.Name -eq 'fake-pi' -or $_.Name -eq 'fake-pi.exe' })
              if ($bad.Count -gt 0) {
                  throw "fake-pi test double must not be shipped in ${ARCHIVE}"
              }
          } finally {
              $zip.Dispose()
          }
          Write-Host "${ARCHIVE} ships no fake-pi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfred-${{ matrix.platform }}
          path: |
            alfred-*.tar.gz
            alfred-*.tar.gz.sha256
            alfred-*.zip
            alfred-*.zip.sha256

  release:
    name: Create Release
    needs: [build, rpc-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            > **Pi is a runtime dependency.** Alfred does not bundle an agent
            > loop. It runs [Pi](https://github.com/earendil-works/pi) as a
            > `pi --mode rpc` subprocess, so install Pi (Node >= 22.19, or the
            > standalone binary) alongside the `alfred` binary. Every archive
            > contains `PI-RUNTIME.txt`, and `scripts/install.sh` /
            > `scripts/install.ps1` install both parts. The release pipeline
            > smoke-checks the Pi RPC handshake before publishing.
          files: |
            artifacts/alfred-*.tar.gz
            artifacts/alfred-*.tar.gz.sha256
            artifacts/alfred-*.zip
            artifacts/alfred-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
